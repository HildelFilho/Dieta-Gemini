<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente esmeralda profundo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1AB394"/>
      <stop offset="52%" stop-color="#0E7C6B"/>
      <stop offset="100%" stop-color="#073D36"/>
    </linearGradient>

    <!-- Brilho radial suave no canto superior esquerdo -->
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.72">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente da folha principal -->
    <linearGradient id="leafMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9F99D"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>

    <!-- Gradiente da folha secundária -->
    <linearGradient id="leafSub" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>

    <!-- Gradiente sutil do monograma D -->
    <linearGradient id="letterD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6F4F1"/>
    </linearGradient>

    <!-- Sombra suave para profundidade -->
    <filter id="drop" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#042622" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- Fundo Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Borda interna sutil de acabamento -->
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>

  <!-- Grupo central com sombra -->
  <g filter="url(#drop)">
    <!-- Folha secundária (broto) -->
    <path d="M188 148 C156 144 138 118 148 92 C176 94 196 116 188 148 Z" fill="url(#leafSub)"/>

    <!-- Folha principal estilizada -->
    <path d="M196 148 C192 98 232 66 286 72 C292 124 256 162 196 148 Z" fill="url(#leafMain)"/>
    <!-- Nervura central da folha -->
    <path d="M206 140 C228 120 250 102 272 86" fill="none" stroke="#0B5D51" stroke-opacity="0.55" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Monograma "D" moderno e geométrico -->
    <path fill="url(#letterD)" fill-rule="evenodd"
      d="M158 172 H258 C346 172 400 224 400 292 C400 360 346 412 258 412 H158 C144 412 134 402 134 388 V196 C134 182 144 172 158 172 Z
         M206 222 V362 H252 C308 362 344 334 344 292 C344 250 308 222 252 222 Z"/>
  </g>
</svg>
